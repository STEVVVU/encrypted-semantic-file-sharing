name: Semantic sharing reproducible metrics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CGO_ENABLED: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r research/semantic-sharing/requirements.txt
          python -m pip install -e research/semantic-sharing --no-deps
      - run: python -m unittest discover -s research/semantic-sharing/tests -v
      - run: python -m semshare download-model --cache-dir .agents/metrics-model-cache
      - run: python -m semshare.benchmark --run-id metrics-${{ github.run_id }}-${{ github.run_attempt }} --cache-dir .agents/metrics-model-cache
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: semantic-sharing-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: .agents/evidence/runs/metrics-${{ github.run_id }}-${{ github.run_attempt }}/
