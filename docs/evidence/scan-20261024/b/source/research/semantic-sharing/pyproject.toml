[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secushare-semantic-sharing"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["cryptography==50.0.2", "httpx==0.28.1", "huggingface-hub==2.2.0", "torch==2.11.0", "transformers==5.20.2"]

[project.scripts]
semshare = "semshare.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
